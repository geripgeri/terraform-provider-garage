name: Release
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases only run from main (.releaserc branches: [main]); got ${{ github.ref }}"
          exit 1

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Release
        id: release
        uses: cycjimmy/semantic-release-action@v8
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits@8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      # semantic-release pushes a new commit + tag. Re-checkout the branch
      # tip explicitly; the default workflow SHA is the parent of the new tag
      # and GoReleaser then aborts with "tag was not made against commit".
      - name: Re-checkout after semantic-release
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Go
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        if: steps.release.outputs.new_release_published == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
